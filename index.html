<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>關西國小 3D 校園導覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：全螢幕 3D 校園模型為主體，左側地點清單、右側資訊卡、下方工具列浮在模型上 */
:root{
  --bg:#eef1ec;          /* 頁面底色（帶一點茶綠的灰） */
  --panel:#fbfcf9f2;     /* 浮動面板 */
  --panel-solid:#fbfcf9;
  --fg:#1f2a24;          /* 主要文字 */
  --muted:#5d6b62;       /* 次要文字 */
  --line:#d5ddd5;        /* 分隔線 */
  --accent:#2f6b4f;      /* 茶園綠：主要按鈕、選取 */
  --accent-fg:#ffffff;
  --accent-soft:#e1eee6;
  --pin:#c4452f;         /* 紅磚色：360 地點 */
  --track:#7a5a8c;       /* 跑道紫，作為第二色 */
  --sky:#cfe0e6;         /* 3D 天空 */
  --shadow:0 6px 24px rgba(20,40,30,.14);
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815;--panel:#1a221ef2;--panel-solid:#1a221e;--fg:#e6ece7;--muted:#9aa89f;--line:#2e3a33;
    --accent:#6fbf94;--accent-fg:#0d1a13;--accent-soft:#223a2d;--pin:#ef7a5f;--track:#b596c7;--sky:#2a3a44;
    --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815;--panel:#1a221ef2;--panel-solid:#1a221e;--fg:#e6ece7;--muted:#9aa89f;--line:#2e3a33;
  --accent:#6fbf94;--accent-fg:#0d1a13;--accent-soft:#223a2d;--pin:#ef7a5f;--track:#b596c7;--sky:#2a3a44;
  --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}

/* 3D 建築標籤 */
.blabel{font-family:var(--font-display);font-size:15px;font-weight:700;color:#1f2a24;background:#ffffffe6;border:1px solid #c9d3cb;
  padding:3px 9px 3px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:auto;cursor:pointer;line-height:1.3}
.blabel small{font-family:var(--font-body);font-weight:500;font-size:11px;color:#5d6b62;margin-left:4px}
.blabel .rooms{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:#33423a;max-width:200px;white-space:normal}
.blabel.minor{font-size:12px;font-weight:400;background:#ffffffc0;padding:1px 6px}
.blabel.on{background:#2f6b4f;color:#fff;border-color:#2f6b4f}
.blabel.on small,.blabel.on .rooms{color:#e1eee6}

/* 浮動元件共用 */
.float{position:fixed;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px}

.brand{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px 9px;display:flex;gap:10px;align-items:center}
.brand .seal{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-size:17px;font-weight:700;flex:none}
.brand h1{margin:0;font-family:var(--font-display);font-size:19px;letter-spacing:.04em;line-height:1.15;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}

#side{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:276px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 0 9px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.search{padding:10px 12px 6px}
.search input{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-solid);color:var(--fg);font:inherit}
.list{overflow:auto;padding:4px 6px 12px;flex:1;min-height:0}
.grp{margin:10px 8px 4px;font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;line-height:1.35}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent);color:var(--accent-fg)}
.item .dot{width:9px;height:9px;border-radius:50%;background:var(--pin);flex:none;box-shadow:0 0 0 2px var(--panel-solid)}
.item .fl{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .fl{color:inherit;opacity:.85}
.item .bsw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0002}

#card{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:330px;max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px 16px 14px}
#card .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--pin);font-weight:700}
#card h2{margin:4px 0 6px;font-family:var(--font-display);font-size:24px;line-height:1.2;text-wrap:balance}
#card .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
#card .x{position:absolute;top:8px;right:8px;border:0;background:none;width:30px;height:30px;border-radius:6px;font-size:18px;color:var(--muted)}
#card .x:hover{background:var(--accent-soft)}
.facts{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:8px}
.facts li{border-left:3px solid var(--line);padding:1px 0 1px 10px}
.facts b{display:block;font-size:12.5px}
.facts span{font-size:13px;color:var(--muted)}
.floors{display:grid;gap:6px;margin:0 0 12px}
.floorrow{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-align:left}
.floorrow:hover{border-color:var(--accent)}
.floorrow b{font-variant-numeric:tabular-nums;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--panel-solid);border-radius:999px;padding:4px 10px;font-size:12.5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-solid);border-radius:7px;padding:8px 12px;font-weight:500;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.welcome p{margin:0 0 10px;line-height:1.65}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;margin:4px 0 14px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}

#dock{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;align-items:center;padding:6px;max-width:calc(100% - 24px);box-sizing:border-box;flex-wrap:wrap;justify-content:center}
#dock .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#dock button{border:0;background:none;border-radius:6px;padding:7px 10px;font-weight:500;white-space:nowrap}
#dock button:hover{background:var(--accent-soft)}
#dock button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#dock .lbl{font-size:12px;color:var(--muted);padding:0 4px 0 6px}

#compass{top:calc(12px + env(safe-area-inset-top,0px));right:calc(354px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--line)}
#compass svg{width:34px;height:34px}

#tip{position:fixed;pointer-events:none;background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:5px 9px;font-size:13px;white-space:nowrap;transform:translate(-50%,-130%);z-index:5}
#tip small{color:var(--muted);margin-left:6px}

#tourbar{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-size:13px}
#tourbar .prog{font-variant-numeric:tabular-nums;color:var(--muted)}

#menuBtn{display:none}

/* 360 環景 */
#pano-wrap{position:fixed;inset:0;z-index:20;background:#0b0f0d}
#pano{position:absolute;inset:0}
.pano-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(#000a,#0000);color:#fff;z-index:2}
.pano-top h3{margin:0;font-family:var(--font-display);font-size:21px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pano-top .pbtn{border:1px solid #ffffff55;background:#00000055;color:#fff;border-radius:7px;padding:7px 12px;white-space:nowrap}
.pano-top .pbtn:hover{background:#ffffff22}
.pano-top .pbtn[aria-pressed="true"]{background:#ffffff33}
.hs-link{width:56px;height:56px;margin:-28px 0 0 -28px;cursor:pointer;position:relative}
.hs-link .arrow{width:56px;height:56px;border-radius:50%;background:#ffffffd9;display:grid;place-items:center;box-shadow:0 2px 10px #0006;transition:transform .15s}
.hs-link:hover .arrow{transform:scale(1.1)}
.hs-link .arrow svg{width:30px;height:30px}
.hs-link .name{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:13px;padding:3px 8px;border-radius:4px;white-space:nowrap}
.hs-info{position:relative;margin:-17px 0 0 -17px;cursor:pointer;max-width:260px}
.hs-info .head{display:flex;align-items:center;gap:8px;background:#2f6b4fe6;color:#fff;border-radius:18px;padding:0 12px 0 0;height:34px;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px #0005}
.hs-info .head i{width:34px;height:34px;border-radius:50%;background:#1f4a36;display:grid;place-items:center;font-style:normal;font-weight:700;font-family:Georgia,serif}
.hs-info .body{display:none;background:#fffffff2;color:#1f2a24;margin-top:4px;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;white-space:normal;width:240px}
.hs-info.open .body{display:block}
.pano-fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#e6ece7;text-align:center}
.pano-fail div{max-width:420px;line-height:1.7}
.pano-fail a{color:#8fd6ae}

@media (max-width:820px){
  #side{display:none;top:calc(70px + env(safe-area-inset-top,0px));width:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6}
  body.menu-open #side{display:flex}
  #menuBtn{display:inline-flex}
  .brand{right:max(12px,env(safe-area-inset-right,0px));padding:8px 10px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  #card{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:42%;z-index:7}
  #compass{top:calc(70px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
  #dock{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #dock .lbl{display:none}
  #dock button{padding:7px 8px}
  #tourbar{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  body.card-open #tourbar{display:none}
}
@media (prefers-reduced-motion:reduce){.hs-link .arrow{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="float brand">
  <div class="seal" aria-hidden="true">關</div>
  <div>
    <h1>關西國小 3D 校園導覽</h1>
    <p>新竹縣關西鎮 · 依衛星影像繪製的示意模型</p>
  </div>
</div>

<button id="compass" class="float" title="朝北重置" aria-label="朝北重置視角">
  <svg viewBox="0 0 40 40" aria-hidden="true"><g id="needle"><path d="M20 4 L25 20 L20 17 L15 20Z" fill="#c4452f"/><path d="M20 36 L25 20 L20 23 L15 20Z" fill="#8a948e"/></g><text x="20" y="13" text-anchor="middle" font-size="0">N</text></svg>
</button>

<aside id="side" class="float" aria-label="地點與建築清單">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-spots" aria-selected="true">360° 地點</button>
    <button role="tab" id="tab-bld" aria-selected="false">建築與樓層</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="搜尋：班級、處室、地點…" aria-label="搜尋"></div>
  <div class="list" id="list"></div>
</aside>

<section id="card" class="float" aria-live="polite"></section>

<div id="tourbar" class="float" hidden>
  <span>導覽中</span><span class="prog" id="tourProg"></span>
  <button class="btn" id="tourPrev">上一站</button>
  <button class="btn" id="tourNext">下一站</button>
  <button class="btn" id="tourStop">結束</button>
</div>

<nav id="dock" class="float" aria-label="檢視工具">
  <button id="menuBtn" aria-label="開啟清單">清單</button>
  <span class="lbl">樓層</span>
  <button data-floor="0" aria-pressed="true">全部</button>
  <button data-floor="1" aria-pressed="false">1F</button>
  <button data-floor="2" aria-pressed="false">2F</button>
  <button data-floor="3" aria-pressed="false">3F</button>
  <button data-floor="4" aria-pressed="false">4F</button>
  <span class="sep"></span>
  <button id="viewBird">鳥瞰</button>
  <button id="viewTop">俯視</button>
  <button id="spin" aria-pressed="false">旋轉</button>
  <span class="sep"></span>
  <button id="tourBtn">開始導覽</button>
</nav>

<div id="tip" hidden></div>

<div id="pano-wrap" hidden>
  <div id="pano"></div>
  <div class="pano-top">
    <button class="pbtn" id="panoBack">← 回 3D 地圖</button>
    <h3 id="panoTitle"></h3>
    <button class="pbtn" id="panoRotate" aria-pressed="false">自動轉</button>
  </div>
</div>

const mat = (color, o={}) => new THREE.MeshStandardMaterial({ color, roughness:.9, metalness:0, ...o });
function shapeFrom(pts){ const s = new THREE.Shape(); pts.forEach(([px,py],i)=>{ const [x,z]=P(px,py); i?s.lineTo(x,-z):s.moveTo(x,-z); }); return s; }
function flat(geom, color, y, recv=true){ const m = new THREE.Mesh(geom, mat(color)); m.rotation.x = -Math.PI/2; m.position.y = y; m.receiveShadow = recv; scene.add(m); return m; }
function rectGeom(x1,y1,x2,y2){ const [a,b]=P(x1,y1),[c,d]=P(x2,y2); const g=new THREE.PlaneGeometry(c-a,d-b); g.translate((a+c)/2,-(b+d)/2,0); return g; }
function pointInPoly(px,py,poly){ let ins=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function distSeg(px,py,[ax,ay],[bx,by]){ const dx=bx-ax,dy=by-ay; const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy))); return Math.hypot(px-ax-t*dx,py-ay-t*dy); }
function distLine(px,py,line){ let m=1e9; for(let i=0;i<line.length-1;i++) m=Math.min(m,distSeg(px,py,line[i],line[i+1])); return m; }

function court(x1,y1,x2,y2, color, lineColor='#f5f5f0', n=1, vertical=true){
  flat(rectGeom(x1-3,y1-3,x2+3,y2+3), '#a5503f', .18);

  for(let i=0;i<n;i++){

    flat(rectGeom(...a), color, .2);
    const [ax,az]=P(a[0],a[1]),[bx,bz]=P(a[2],a[3]);
    const pts=[[ax,az],[bx,az],[bx,bz],[ax,bz],[ax,az]].map(([x,z])=>new THREE.Vector3(x,.23,z));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:lineColor})));
    const mid=vertical?[[ax,(az+bz)/2],[bx,(az+bz)/2]]:[[(ax+bx)/2,az],[(ax+bx)/2,bz]];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(mid.map(([x,z])=>new THREE.Vector3(x,.23,z))), new THREE.LineBasicMaterial({color:lineColor})));
  }
}

    b.roofMesh.visible = (f===0 || f>=b.floors);
    const H = top*(b.h||FH)+.1;

let fly=null;
function flyTo(target, dist, polar){
  const dir=camera.position.clone().sub(controls.target).normalize();
  if(polar!==undefined){ const az=Math.atan2(dir.x,dir.z); dir.set(Math.sin(polar)*Math.sin(az), Math.cos(polar), Math.sin(polar)*Math.cos(az)); }
  const endPos=target.clone().add(dir.multiplyScalar(dist));
  fly={ t:0, dur: matchMedia('(prefers-reduced-motion: reduce)').matches?.01:1.1, p0:camera.position.clone(), t0:controls.target.clone(), p1:endPos, t1:target.clone() };
}

/* 滑鼠／觸控選取 */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  const vis=pickables.filter(o=>{ let p=o; while(p){ if(!p.visible) return false; p=p.parent; } return true; });
  const hits=ray.intersectObjects(vis,false);
  return hits.find(h=>h.object.userData.type==='spot') || hits[0];
}
let down=null;
renderer.domElement.addEventListener('pointerdown', e=>{ down=[e.clientX,e.clientY]; if(fly) fly=null; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return; down=null;
  const h=pick(e); if(!h) return; stopTour();
  if(h.object.userData.type==='spot') selectSpot(h.object.userData.id); else if(h.object.userData.type==='building') selectBuilding(h.object.userData.id);
});
let hoverRaf=0;
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerType!=='mouse' || hoverRaf) return;
  hoverRaf=requestAnimationFrame(()=>{ hoverRaf=0; const h=pick(e);
    if(h && h.object.userData.type==='spot'){ const id=h.object.userData.id; tip.innerHTML=`${SC[id].name}<small>${placeOf(id)}</small>`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; renderer.domElement.style.cursor='pointer'; }
    else if(h && h.object.userData.type==='building'){ const b=BMAP[h.object.userData.id]; tip.innerHTML=`${b.name}<small>${h.object.userData.floor}F</small>`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; renderer.domElement.style.cursor='pointer'; }
    else { tip.hidden=true; renderer.domElement.style.cursor=''; } });
});

  return mzReady;
}
function canLoadTiles(){ return new Promise(res=>{ const im=new Image(); im.crossOrigin='anonymous'; const t=setTimeout(()=>res(false),8000); im.onload=()=>{clearTimeout(t);res(true)}; im.onerror=()=>{clearTimeout(t);res(false)}; im.src=PANO_BASE+'tiles/0-/preview.jpg'; }); }
let tilesOK=null;
function showPanoFail(id){
  $('#pano').innerHTML=`<div class="pano-fail"><div><p style="font-size:17px;margin:0 0 8px">這個頁面環境無法載入 360° 影像</p>
  <p style="margin:0 0 14px;color:#b9c4bd">360° 照片放在學校的環景網站上。請改到原網站觀看「${SC[id].name}」，或把這個網頁放到 GitHub Pages 或直接在電腦上開啟。</p>
  <a href="${SITE_360}" target="_blank" rel="noopener">開啟關西國小 360° 環景網站 ↗</a></div></div>`;
}
async function openPano(id){
  stopTour(); $('#pano-wrap').hidden=false; $('#panoTitle').textContent=SC[id].name;
  if(tilesOK===null) tilesOK=await canLoadTiles();
  if(!tilesOK){ showPanoFail(id); return; }
  try{ await loadMarzipano(); }catch{ tilesOK=false; showPanoFail(id); return; }
  if(!viewer) viewer=new Marzipano.Viewer($('#pano'), { controls:{ mouseViewMode:'drag' } });
  switchPano(id);
}
function makeScene(id){
  if(mzScenes[id]) return mzScenes[id];
  const s=SC[id];
  const source=Marzipano.ImageUrlSource.fromString(PANO_BASE+'tiles/'+id+'/{z}/{f}/{y}/{x}.jpg', { cubeMapPreviewUrl: PANO_BASE+'tiles/'+id+'/preview.jpg' });
  const geometry=new Marzipano.CubeGeometry(LEVELS);
  const limiter=Marzipano.RectilinearView.limit.traditional(1344, 100*Math.PI/180, 120*Math.PI/180);
  const view=new Marzipano.RectilinearView({ yaw:s.v[0], pitch:s.v[1], fov:1.44 }, limiter);
  const sc=viewer.createScene({ source, geometry, view, pinFirstLevel:true });
  s.links.forEach(([target,yaw,pitch])=>{
    const el=document.createElement('div'); el.className='hs-link'; el.innerHTML=`<div class="arrow">${arrowSVG}</div><div class="name">${SC[target].name}</div>`;
    el.addEventListener('click',()=>switchPano(target)); sc.hotspotContainer().createHotspot(el,{yaw,pitch});
  });
  s.infos.forEach(([yaw,pitch,title,text])=>{
    const el=document.createElement('div'); el.className='hs-info'; el.innerHTML=`<div class="head"><i>i</i>${title}</div><div class="body">${text}</div>`;
    el.addEventListener('click',()=>el.classList.toggle('open')); sc.hotspotContainer().createHotspot(el,{yaw,pitch});
  });
  return mzScenes[id]={ sc, view, s };
}
function switchPano(id){
  const o=makeScene(id); o.view.setParameters({ yaw:o.s.v[0], pitch:o.s.v[1], fov:1.44 });
  o.sc.switchTo({ transitionDuration: 700 }); curPano=id; $('#panoTitle').textContent=SC[id].name;
  if(autorot) viewer.startMovement(autorot);
  selectSpot(id, { dist:85 });
}
$('#panoBack').onclick=()=>{ $('#pano-wrap').hidden=true; if(viewer) viewer.stopMovement(); };
$('#panoRotate').onclick=()=>{ if(!viewer) return; if(autorot){ viewer.stopMovement(); autorot=null; } else { autorot=Marzipano.autorotate({ yawSpeed:.04, targetPitch:0, targetFov:Math.PI/2 }); viewer.startMovement(autorot); } $('#panoRotate').setAttribute('aria-pressed', String(!!autorot)); };
addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#pano-wrap').hidden) $('#panoBack').click(); });

/* ================== 迴圈 ================== */
const needle=document.getElementById('needle');
const clock=new THREE.Clock();
function frame(){
  const dt=clock.getDelta();
  if(fly){ fly.t=Math.min(1,fly.t+dt/fly.dur); const k=fly.t<.5?4*fly.t**3:1-(-2*fly.t+2)**3/2; camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=1) fly=null; }
  controls.update();
  const az=Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
  needle.setAttribute('transform', `rotate(${(az*180/Math.PI).toFixed(1)} 20 20)`);
  const t=performance.now()/1000;
  Object.entries(pins).forEach(([id,p])=>{ if(!(selected?.type==='spot' && selected.id===id)) p.g.position.y = spotY(id)+.2+Math.sin(t*2+p.g.position.x)*.25; });
  if($('#pano-wrap').hidden){ renderer.render(scene,camera); labelRenderer.render(scene,camera); }
  requestAnimationFrame(frame);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

camera.position.set(HOME.x-40, 170, HOME.z+215); controls.target.copy(HOME);
setFloor(0); showWelcome(); frame();
</script>
