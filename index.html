<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>關西國小 3D 校園導覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：全螢幕 3D 校園模型為主體，左側地點清單、右側資訊卡、下方工具列浮在模型上 */
:root{
  --bg:#eef1ec;          /* 頁面底色（帶一點茶綠的灰） */
  --panel:#fbfcf9f2;     /* 浮動面板 */
  --panel-solid:#fbfcf9;
  --fg:#1f2a24;          /* 主要文字 */
  --muted:#5d6b62;       /* 次要文字 */
  --line:#d5ddd5;        /* 分隔線 */
  --accent:#2f6b4f;      /* 茶園綠：主要按鈕、選取 */
  --accent-fg:#ffffff;
  --accent-soft:#e1eee6;
  --pin:#c4452f;         /* 紅磚色：360 地點 */
  --track:#7a5a8c;       /* 跑道紫，作為第二色 */
  --sky:#cfe0e6;         /* 3D 天空 */
  --shadow:0 6px 24px rgba(20,40,30,.14);
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815;--panel:#1a221ef2;--panel-solid:#1a221e;--fg:#e6ece7;--muted:#9aa89f;--line:#2e3a33;
    --accent:#6fbf94;--accent-fg:#0d1a13;--accent-soft:#223a2d;--pin:#ef7a5f;--track:#b596c7;--sky:#2a3a44;
    --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815;--panel:#1a221ef2;--panel-solid:#1a221e;--fg:#e6ece7;--muted:#9aa89f;--line:#2e3a33;
  --accent:#6fbf94;--accent-fg:#0d1a13;--accent-soft:#223a2d;--pin:#ef7a5f;--track:#b596c7;--sky:#2a3a44;
  --shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}

/* 3D 建築標籤 */
.blabel{font-family:var(--font-display);font-size:15px;font-weight:700;color:#1f2a24;background:#ffffffe6;border:1px solid #c9d3cb;
  padding:3px 9px 3px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:auto;cursor:pointer;line-height:1.3}
.blabel small{font-family:var(--font-body);font-weight:500;font-size:11px;color:#5d6b62;margin-left:4px}
.blabel .rooms{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:#33423a;max-width:200px;white-space:normal}
.blabel.minor{font-size:12px;font-weight:400;background:#ffffffc0;padding:1px 6px}
.blabel.on{background:#2f6b4f;color:#fff;border-color:#2f6b4f}
.blabel.on small,.blabel.on .rooms{color:#e1eee6}

/* 浮動元件共用 */
.float{position:fixed;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px}

.brand{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px 9px;display:flex;gap:10px;align-items:center}
.brand .seal{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-size:17px;font-weight:700;flex:none}
.brand h1{margin:0;font-family:var(--font-display);font-size:19px;letter-spacing:.04em;line-height:1.15;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}

#side{top:calc(78px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:276px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 0 9px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.search{padding:10px 12px 6px}
.search input{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-solid);color:var(--fg);font:inherit}
.list{overflow:auto;padding:4px 6px 12px;flex:1;min-height:0}
.grp{margin:10px 8px 4px;font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;line-height:1.35}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent);color:var(--accent-fg)}
.item .dot{width:9px;height:9px;border-radius:50%;background:var(--pin);flex:none;box-shadow:0 0 0 2px var(--panel-solid)}
.item .fl{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .fl{color:inherit;opacity:.85}
.item .bsw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0002}

#card{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:330px;max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px 16px 14px}
#card .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--pin);font-weight:700}
#card h2{margin:4px 0 6px;font-family:var(--font-display);font-size:24px;line-height:1.2;text-wrap:balance}
#card .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
#card .x{position:absolute;top:8px;right:8px;border:0;background:none;width:30px;height:30px;border-radius:6px;font-size:18px;color:var(--muted)}
#card .x:hover{background:var(--accent-soft)}
.facts{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:8px}
.facts li{border-left:3px solid var(--line);padding:1px 0 1px 10px}
.facts b{display:block;font-size:12.5px}
.facts span{font-size:13px;color:var(--muted)}
.floors{display:grid;gap:6px;margin:0 0 12px}
.floorrow{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-align:left}
.floorrow:hover{border-color:var(--accent)}
.floorrow b{font-variant-numeric:tabular-nums;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--panel-solid);border-radius:999px;padding:4px 10px;font-size:12.5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-solid);border-radius:7px;padding:8px 12px;font-weight:500;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.welcome p{margin:0 0 10px;line-height:1.65}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;margin:4px 0 14px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}

#dock{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;align-items:center;padding:6px;max-width:calc(100% - 24px);box-sizing:border-box;flex-wrap:wrap;justify-content:center}
#dock .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#dock button{border:0;background:none;border-radius:6px;padding:7px 10px;font-weight:500;white-space:nowrap}
#dock button:hover{background:var(--accent-soft)}
#dock button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#dock .lbl{font-size:12px;color:var(--muted);padding:0 4px 0 6px}

#compass{top:calc(12px + env(safe-area-inset-top,0px));right:calc(354px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid var(--line)}
#compass svg{width:34px;height:34px}

#tip{position:fixed;pointer-events:none;background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:5px 9px;font-size:13px;white-space:nowrap;transform:translate(-50%,-130%);z-index:5}
#tip small{color:var(--muted);margin-left:6px}

#tourbar{left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-size:13px}
#tourbar .prog{font-variant-numeric:tabular-nums;color:var(--muted)}

#menuBtn{display:none}

/* 散步模式 */
body.walking #side, body.walking #card, body.walking #dock, body.walking #compass, body.walking #tourbar, body.walking .brand{display:none}
body.walking #stage canvas{cursor:grab}
body.walking #labels{display:none}
.walkbar{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 8px 8px 14px;max-width:calc(100% - 24px);box-sizing:border-box}
.walkbar strong{font-family:var(--font-display);font-size:16px;white-space:nowrap}
.walkbar .hint{font-size:12.5px;color:var(--muted);min-width:0}
#mini{top:calc(64px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:200px;height:160px;padding:0}
#walkPrompt{left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:15px}
#joy{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff40;border:2px solid #ffffffa0;box-shadow:var(--shadow);touch-action:none;display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffffd9;box-shadow:0 2px 6px #0004}
body.touch #joy{display:block}
@media (max-width:820px){ .walkbar .hint{display:none} #mini{width:140px;height:112px} #walkPrompt{bottom:calc(160px + env(safe-area-inset-bottom,0px))} }

/* 360 環景 */
#pano-wrap{position:fixed;inset:0;z-index:20;background:#0b0f0d}
#pano{position:absolute;inset:0}
.pano-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(#000a,#0000);color:#fff;z-index:2}
.pano-top h3{margin:0;font-family:var(--font-display);font-size:21px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pano-top .pbtn{border:1px solid #ffffff55;background:#00000055;color:#fff;border-radius:7px;padding:7px 12px;white-space:nowrap}
.pano-top .pbtn:hover{background:#ffffff22}
.pano-top .pbtn[aria-pressed="true"]{background:#ffffff33}
.hs-link{width:56px;height:56px;margin:-28px 0 0 -28px;cursor:pointer;position:relative}
.hs-link .arrow{width:56px;height:56px;border-radius:50%;background:#ffffffd9;display:grid;place-items:center;box-shadow:0 2px 10px #0006;transition:transform .15s}
.hs-link:hover .arrow{transform:scale(1.1)}
.hs-link .arrow svg{width:30px;height:30px}
.hs-link .name{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:13px;padding:3px 8px;border-radius:4px;white-space:nowrap}
.hs-info{position:relative;margin:-17px 0 0 -17px;cursor:pointer;max-width:260px}
.hs-info .head{display:flex;align-items:center;gap:8px;background:#2f6b4fe6;color:#fff;border-radius:18px;padding:0 12px 0 0;height:34px;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px #0005}
.hs-info .head i{width:34px;height:34px;border-radius:50%;background:#1f4a36;display:grid;place-items:center;font-style:normal;font-weight:700;font-family:Georgia,serif}
.hs-info .body{display:none;background:#fffffff2;color:#1f2a24;margin-top:4px;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;white-space:normal;width:240px}
.hs-info.open .body{display:block}
.pano-fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#e6ece7;text-align:center}
.pano-fail div{max-width:420px;line-height:1.7}
.pano-fail a{color:#8fd6ae}

@media (max-width:820px){
  #side{display:none;top:calc(70px + env(safe-area-inset-top,0px));width:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6}
  body.menu-open #side{display:flex}
  #menuBtn{display:inline-flex}
  .brand{right:max(12px,env(safe-area-inset-right,0px));padding:8px 10px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  #card{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:42%;z-index:7}
  #compass{top:calc(70px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
  #dock{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #dock .lbl{display:none}
  #dock button{padding:7px 8px}
  #tourbar{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  body.card-open #tourbar{display:none}
}
@media (prefers-reduced-motion:reduce){.hs-link .arrow{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="float brand">
  <div class="seal" aria-hidden="true">關</div>
  <div>
    <h1>關西國小 3D 校園導覽</h1>
    <p>新竹縣關西鎮 · 依衛星影像繪製的示意模型</p>
  </div>
</div>

<button id="compass" class="float" title="朝北重置" aria-label="朝北重置視角">
  <svg viewBox="0 0 40 40" aria-hidden="true"><g id="needle"><path d="M20 4 L25 20 L20 17 L15 20Z" fill="#c4452f"/><path d="M20 36 L25 20 L20 23 L15 20Z" fill="#8a948e"/></g><text x="20" y="13" text-anchor="middle" font-size="0">N</text></svg>
</button>

<aside id="side" class="float" aria-label="地點與建築清單">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-spots" aria-selected="true">360° 地點</button>
    <button role="tab" id="tab-bld" aria-selected="false">建築與樓層</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="搜尋：班級、處室、地點…" aria-label="搜尋"></div>
  <div class="list" id="list"></div>
</aside>

<section id="card" class="float" aria-live="polite"></section>

<div id="tourbar" class="float" hidden>
  <span>導覽中</span><span class="prog" id="tourProg"></span>
  <button class="btn" id="tourPrev">上一站</button>
  <button class="btn" id="tourNext">下一站</button>
  <button class="btn" id="tourStop">結束</button>
</div>

<nav id="dock" class="float" aria-label="檢視工具">
  <button id="menuBtn" aria-label="開啟清單">清單</button>
  <span class="lbl">樓層</span>
  <button data-floor="0" aria-pressed="true">全部</button>
  <button data-floor="1" aria-pressed="false">1F</button>
  <button data-floor="2" aria-pressed="false">2F</button>
  <button data-floor="3" aria-pressed="false">3F</button>
  <button data-floor="4" aria-pressed="false">4F</button>
  <span class="sep"></span>
  <button id="viewBird">鳥瞰</button>
  <button id="viewTop">俯視</button>
  <button id="spin" aria-pressed="false">旋轉</button>
  <span class="sep"></span>
  <button id="walkBtn" title="也可以在地圖上任何地方點兩下，直接從那裡開始散步">散步</button>
  <button id="tourBtn">開始導覽</button>
</nav>

<div id="tip" hidden></div>

<div id="walkHud" hidden>
  <div class="float walkbar">
    <strong>散步中</strong>
    <span class="hint" id="walkHint">W A S D 或方向鍵移動・拖曳畫面轉頭・按住 Shift 跑步</span>
    <button class="btn" id="walkExit">離開散步</button>
  </div>
  <canvas id="mini" class="float" width="200" height="160" aria-label="小地圖"></canvas>
  <button id="walkPrompt" class="float" hidden></button>
  <div id="joy" aria-hidden="true"><div id="joyKnob"></div></div>
</div>

<div id="pano-wrap" hidden>
  <div id="pano"></div>
  <div class="pano-top">
    <button class="pbtn" id="panoBack">← 回 3D 地圖</button>
    <h3 id="panoTitle"></h3>
    <button class="pbtn" id="panoRotate" aria-pressed="false">自動轉</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================== 資料 ==================
   座標使用衛星截圖的像素 (px, py)，1 px ≈ 0.55 公尺。
   想微調建築或地點位置時，直接修改下面的像素數字即可。 */
const S = 0.55, OX = 1060, OY = 460, FH = 3.6;
const P = (px, py) => [(px - OX) * S, (py - OY) * S];
const PANO_BASE = 'https://kingvincentwang.github.io/360school/';

function court(x1,y1,x2,y2, color, lineColor='#f5f5f0', n=1, vertical=true){
  flat(rectGeom(x1-3,y1-3,x2+3,y2+3), '#a5503f', .18);
  const step=(vertical?(y2-y1):(x2-x1))/n;
  for(let i=0;i<n;i++){
    const a=vertical?[x1,y1+i*step+2,x2,y1+(i+1)*step-2]:[x1+i*step+2,y1,x1+(i+1)*step-2,y2];
    flat(rectGeom(...a), color, .2);
    const [ax,az]=P(a[0],a[1]),[bx,bz]=P(a[2],a[3]);
    const pts=[[ax,az],[bx,az],[bx,bz],[ax,bz],[ax,az]].map(([x,z])=>new THREE.Vector3(x,.23,z));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:lineColor})));
    const mid=vertical?[[ax,(az+bz)/2],[bx,(az+bz)/2]]:[[(ax+bx)/2,az],[(ax+bx)/2,bz]];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(mid.map(([x,z])=>new THREE.Vector3(x,.23,z))), new THREE.LineBasicMaterial({color:lineColor})));
  }
}

    const top = f===0 ? b.floors : Math.min(f, b.floors);
    b.slabs.forEach(m=>m.visible = m.userData.floor <= top);
    b.roofMesh.visible = (f===0 || f>=b.floors);
    const H = top*(b.h||FH)+.1;
    b.label.position.y = H+3;
    const rooms=b.labelEl.querySelector('.rooms');
    if(f>0 && !b.minor && f<=b.floors && b.rooms[f-1]){ rooms.hidden=false; rooms.textContent=`${floorName(f)}：${b.rooms[f-1]}`; } else rooms.hidden=true;

  });

  Object.entries(pins).forEach(([id,p])=>{ p.g.visible = f===0 || p.floor===f; });
  renderList();
}

let fly=null;
function flyTo(target, dist, polar){
  const dir=camera.position.clone().sub(controls.target).normalize();
  if(polar!==undefined){ const az=Math.atan2(dir.x,dir.z); dir.set(Math.sin(polar)*Math.sin(az), Math.cos(polar), Math.sin(polar)*Math.cos(az)); }
  const endPos=target.clone().add(dir.multiplyScalar(dist));
  fly={ t:0, dur: matchMedia('(prefers-reduced-motion: reduce)').matches?.01:1.1, p0:camera.position.clone(), t0:controls.target.clone(), p1:endPos, t1:target.clone() };
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  const vis=pickables.filter(o=>{ let p=o; while(p){ if(!p.visible) return false; p=p.parent; } return true; });
  const hits=ray.intersectObjects(vis,false);
  return hits.find(h=>h.object.userData.type==='spot') || hits[0];
}
let down=null, lastTap=null;
renderer.domElement.addEventListener('pointerdown', e=>{ down=[e.clientX,e.clientY]; if(fly) fly=null; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(walk.on) return;
  if(!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return; down=null;
  const h=pick(e), now=performance.now();
  if(lastTap && now-lastTap.t<380 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){ const at=lastTap.at; lastTap=null; if(at) enterWalk(at); return; }
  let gp=h?h.point:null;
  if(!gp){ const v=new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),v)){ gp=v; if(inPit(v.x,v.z)) ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),PIT_D),gp); else if(inHigh(v.x,v.z)) ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-RISE),gp); } }
  lastTap={t:now, x:e.clientX, y:e.clientY, at:gp?{x:gp.x, z:gp.z, dir:ray.ray.direction.clone()}:null};

  const [,zb1]=P(0,412), [,zb2]=P(0,545);   // 東側：看台和南段種樹的那一排都不用欄杆
  for(let i=0;i<PIT.length;i++){ const [x1,z1]=P(...PIT[i]), [x2,z2]=P(...PIT[(i+1)%PIT.length]); const len=Math.hypot(x2-x1,z2-z1), ang=-Math.atan2(z2-z1,x2-x1);
    const w=new THREE.Mesh(new THREE.BoxGeometry(len,PIT_D+.25,.35), wallM); w.position.set((x1+x2)/2,-PIT_D/2+.12,(z1+z2)/2); w.rotation.y=ang; w.receiveShadow=true; w.userData.noWalk=true; scene.add(w);
    // 上緣欄杆（看台那一段不用）
    const east=Math.abs(x2-x1)<.5 && x1>P(940,0)[0]; const n=Math.round(len/1.5);
    for(let k=0;k<=n;k++){ const x=x1+(x2-x1)*k/n, z=z1+(z2-z1)*k/n; if(east && z>zb1-1 && z<zb2+1) continue;
      const post=new THREE.Mesh(new THREE.BoxGeometry(.06,1.1,.06), railM); post.position.set(x,.8,z); scene.add(post); }
    const segs = east ? [[z1,Math.min(z2,zb1)],[Math.max(z1,zb2),z2]].filter(([a,b])=>b-a>.5) : [[0,1]];
    segs.forEach(([a,b])=>{ const isV=east; const L=isV?b-a:len; const r=new THREE.Mesh(new THREE.BoxGeometry(L,.06,.06), railM); r.rotation.y=ang;
      if(isV){ r.rotation.y=Math.PI/2; r.position.set(x1,1.33,(a+b)/2); } else r.position.set((x1+x2)/2,1.33,(z1+z2)/2); scene.add(r); });
  }
}
const walk={ on:false, pos:new THREE.Vector3(), foot:0, yaw:0, pitch:0, keys:{}, joy:{x:0,y:0}, obs:null, grid:null, prev:null, near:null, look:null };
const EYE=1.55, RADIUS=.4, CELL=10, STEP=.6, HEAD=1.7, FOOT=.3;
// 把場景裡的方塊、柱子整理成「有方向的盒子」，用格子加速查詢：
// 比腳高出一階以上、又低於頭的當牆擋住；頂面在一階以內的可以踩上去（樓梯、台階、平台、斜坡）
function buildObstacles(){
  const obs=[], grid=new Map(); scene.updateMatrixWorld(true);
  const M=new THREE.Matrix4(), IM=new THREE.Matrix4(), c=new THREE.Vector3(), ax=new THREE.Vector3(), ay=new THREE.Vector3(), az=new THREE.Vector3();
  const visible=o=>{ for(let p=o;p;p=p.parent) if(!p.visible) return false; return true; };
  const add=(g,Mw)=>{ if(!g.boundingBox) g.computeBoundingBox(); const bb=g.boundingBox;
    c.copy(bb.min).add(bb.max).multiplyScalar(.5).applyMatrix4(Mw); Mw.extractBasis(ax,ay,az);
    const sx=ax.length(), sy=ay.length(), sz=az.length(); if(!sx||!sy||!sz) return;
    if(ay.y<0) ay.negate();   // 翻過來擺的盒子（上下對稱）也照樣算
    const up=ay.y/sy; if(up<.5) return;
    const hx=(bb.max.x-bb.min.x)/2*sx, hy=(bb.max.y-bb.min.y)/2*sy, hz=(bb.max.z-bb.min.z)/2*sz;
    if(Math.max(hx,hz)<.08 || hx>150 || hz>150) return;
    const nx=ay.x/sy, ny=up, nz=ay.z/sy;
    const o={x:c.x,y:c.y,z:c.z,hx,hy,hz, a:[ax.x/sx,ax.y/sx,ax.z/sx], b:[az.x/sz,az.y/sz,az.z/sz], n:[nx,ny,nz], tilt:up<.95,
      ux:ax.x/sx,uz:ax.z/sx,vx:az.x/sz,vz:az.z/sz, yb:c.y-hy, yt:c.y+hy, wall:up>=.95 && hy*2>=.4 && c.y-hy<40 };
    obs.push(o);
    const R=Math.hypot(hx,hz,o.tilt?hy:0); for(let i=Math.floor((o.x-R)/CELL); i<=Math.floor((o.x+R)/CELL); i++) for(let j=Math.floor((o.z-R)/CELL); j<=Math.floor((o.z+R)/CELL); j++){ const k=i+','+j; if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(o); } };
  scene.traverse(o=>{
    if(!o.isMesh || !visible(o) || o.userData.noWalk || pinGroup===o.parent?.parent || o.parent===pinGroup) return;   // 運動場下沉邊牆照舊可以直接走下去、走上來
    if(o.isInstancedMesh){ if(!o.userData.solid) return; for(let i=0;i<o.count;i++){ o.getMatrixAt(i,IM); M.multiplyMatrices(o.matrixWorld,IM); add(o.geometry,M); } return; }
    const t=o.geometry.type; if(t==='BoxGeometry' || t==='CylinderGeometry' || t==='ConeGeometry') add(o.geometry,o.matrixWorld);
  });
  walk.obs=obs; walk.grid=grid;
}
const isWall=(o,foot)=>o.wall && o.yt>foot+STEP && o.yb<foot+HEAD;
// 某一點腳下的高度：地面（運動場是下沉的）或一階以內踩得上去的最高頂面
function groundAt(x,z,foot){
  let best=baseY(x,z); const i=Math.floor(x/CELL), j=Math.floor(z/CELL), seen=new Set();
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){ const list=walk.grid.get((i+di)+','+(j+dj)); if(!list) continue;
    for(const o of list){ if(seen.has(o)) continue; seen.add(o);
      const tx=o.x+o.n[0]*o.hy, ty=o.y+o.n[1]*o.hy, tz=o.z+o.n[2]*o.hy;   // 頂面中心
      const yt=ty-(o.n[0]*(x-tx)+o.n[2]*(z-tz))/o.n[1];
      if(yt<=best || yt>foot+STEP+(o.tilt?.45:0)) continue;
      const dx=x-o.x, dy=yt-o.y, dz=z-o.z;
      if(Math.abs(dx*o.a[0]+dy*o.a[1]+dz*o.a[2])>o.hx+FOOT || Math.abs(dx*o.b[0]+dy*o.b[1]+dz*o.b[2])>o.hz+FOOT) continue;   // 腳掌有寬度，踩到邊緣也算
      best=yt; } }
  return best;
}
function collide(p,foot=0){
  for(let pass=0;pass<2;pass++){ const i=Math.floor(p.x/CELL), j=Math.floor(p.z/CELL); const seen=new Set();
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){ const list=walk.grid.get((i+di)+','+(j+dj)); if(!list) continue;
      for(const o of list){ if(seen.has(o)) continue; seen.add(o); if(!isWall(o,foot)) continue;
        const dx=p.x-o.x, dz=p.z-o.z; let lx=dx*o.ux+dz*o.uz, lz=dx*o.vx+dz*o.vz;
        const px=o.hx+RADIUS-Math.abs(lx), pz=o.hz+RADIUS-Math.abs(lz); if(px<=0 || pz<=0) continue;
        if(px<pz) lx+=Math.sign(lx||1)*px; else lz+=Math.sign(lz||1)*pz;
        p.x=o.x+o.ux*lx+o.vx*lz; p.z=o.z+o.uz*lx+o.vz*lz; } } }
  p.x=Math.max(-450,Math.min(450,p.x)); p.z=Math.max(-450,Math.min(450,p.z));
}
// 小地圖：靜態底圖畫一次，每格只畫自己的位置
const mini=$('#mini'), miniCtx=mini.getContext('2d'); let miniBase=null;
const MX0=720, MY0=250, MW=480, MH=384;
const toMini=(px,py)=>[(px-MX0)/MW*mini.width, (py-MY0)/MH*mini.height];
function drawMiniBase(){
  const c=document.createElement('canvas'); c.width=mini.width; c.height=mini.height; const g=c.getContext('2d');
  g.fillStyle='#9fb48a'; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle='#6d716d'; g.lineCap='round'; ROADS.forEach(r=>{ g.lineWidth=Math.max(2,r.w/MW*c.width); g.beginPath(); r.pts.forEach(([x,y],i)=>{ const [a,b]=toMini(x,y); i?g.lineTo(a,b):g.moveTo(a,b); }); g.stroke(); });
  g.fillStyle='#d6d2c6'; g.beginPath(); CAMPUS.forEach(([x,y],i)=>{ const [a,b]=toMini(x,y); i?g.lineTo(a,b):g.moveTo(a,b); }); g.closePath(); g.fill();
  { const [a,b]=toMini(888,442); g.strokeStyle='#a5503f'; g.lineWidth=3; g.beginPath(); g.ellipse(a,b,46/MW*c.width,82/MH*c.height,0,0,Math.PI*2); g.stroke(); }
  BUILDINGS.forEach(b=>{ const [a1,b1]=toMini(b.r[0],b.r[1]), [a2,b2]=toMini(b.r[2],b.r[3]); g.fillStyle=b.outside?'#b5afa3':b.wall; g.fillRect(a1,b1,a2-a1,b2-b1); g.strokeStyle='#00000055'; g.lineWidth=1; g.strokeRect(a1,b1,a2-a1,b2-b1); });
  miniBase=c;
}
function drawMini(){
  if(!miniBase) drawMiniBase(); miniCtx.drawImage(miniBase,0,0);
  const [a,b]=toMini(walk.pos.x/S+OX, walk.pos.z/S+OY);
  miniCtx.save(); miniCtx.translate(a,b); miniCtx.rotate(-walk.yaw);
  miniCtx.fillStyle='#c4452f'; miniCtx.strokeStyle='#fff'; miniCtx.lineWidth=1.5; miniCtx.beginPath(); miniCtx.moveTo(0,-8); miniCtx.lineTo(5.5,6); miniCtx.lineTo(0,3); miniCtx.lineTo(-5.5,6); miniCtx.closePath(); miniCtx.fill(); miniCtx.stroke(); miniCtx.restore();
}
function blocked(x,z){ const i=Math.floor(x/CELL), j=Math.floor(z/CELL);
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){ const list=walk.grid.get((i+di)+','+(j+dj)); if(!list) continue;
    for(const o of list){ if(!isWall(o,baseY(x,z))) continue; const dx=x-o.x, dz=z-o.z; if(Math.abs(dx*o.ux+dz*o.uz)<o.hx+RADIUS && Math.abs(dx*o.vx+dz*o.vz)<o.hz+RADIUS) return true; } }
  return false; }
// 點在建築物上時，找最近一個走得到的空地
function freeSpot(x,z){ if(!blocked(x,z)) return [x,z];
  for(let r=.5;r<40;r+=.5){ const n=Math.max(8,Math.round(r*6)); for(let k=0;k<n;k++){ const a=k/n*Math.PI*2, px=x+Math.cos(a)*r, pz=z+Math.sin(a)*r; if(!blocked(px,pz)) return [px,pz]; } }
  return [x,z]; }
function enterWalk(at){
  if(walk.on) return;
  stopTour(); setFloor(0); fly=null; tip.hidden=true;
  walk.prev={pos:camera.position.clone(), tgt:controls.target.clone()};
  controls.enabled=false; controls.autoRotate=false; $('#spin').setAttribute('aria-pressed','false');
  if(!walk.obs) buildObstacles();
  if(at && at.x!==undefined){ const [x,z]=freeSpot(at.x,at.z); walk.pos.set(x,0,z); walk.yaw=Math.atan2(-at.dir.x,-at.dir.z); }   // 點兩下的位置，面向原本視角的方向
  else { const [x,z]=P(1117,589); walk.pos.set(x,0,z); walk.yaw=0; }   // 從校門口外的斑馬線出發，面向校門
  walk.pitch=.05; walk.foot=walk.eye=groundAt(walk.pos.x,walk.pos.z,baseY(walk.pos.x,walk.pos.z));
  camera.near=.1; camera.updateProjectionMatrix(); camera.rotation.order='YXZ';
  Object.values(pins).forEach(p=>{ p.g.visible=p.floor===1; p.m.depthTest=true; p.g.scale.setScalar(.45); p.g.children[2].visible=false; });
  walk.on=true; document.body.classList.add('walking'); $('#walkHud').hidden=false; $('#walkPrompt').hidden=true;
  renderer.domElement.focus?.();
}
function exitWalk(){
  if(!walk.on) return; walk.on=false; walk.keys={}; walk.joy={x:0,y:0}; walk.look=null;
  document.body.classList.remove('walking'); $('#walkHud').hidden=true;
  camera.near=1; camera.updateProjectionMatrix(); camera.rotation.order='XYZ';
  Object.values(pins).forEach(p=>{ p.m.depthTest=false; p.g.children[2].visible=true; }); setFloor(floorFilter); highlightPins();
  camera.position.copy(walk.prev.pos); controls.target.copy(walk.prev.tgt); controls.enabled=true; controls.update();
}
$('#walkBtn').onclick=()=>enterWalk(); $('#walkExit').onclick=exitWalk;
$('#walkPrompt').onclick=()=>{ if(walk.near) openPano(walk.near); };
addEventListener('keydown', e=>{ if(!walk.on || !$('#pano-wrap').hidden) return;
  if(e.key==='Escape'){ exitWalk(); return; }
  if(e.code==='KeyE' && walk.near){ openPano(walk.near); return; }
  walk.keys[e.code]=true; if(e.code.startsWith('Arrow') || e.code==='Space') e.preventDefault(); });
addEventListener('keyup', e=>{ walk.keys[e.code]=false; });
addEventListener('blur', ()=>{ walk.keys={}; });
// 拖曳畫面轉頭（滑鼠或手指）
renderer.domElement.addEventListener('pointerdown', e=>{ if(!walk.on) return; walk.look={id:e.pointerId,x:e.clientX,y:e.clientY}; renderer.domElement.setPointerCapture?.(e.pointerId); if(e.pointerType!=='mouse') document.body.classList.add('touch'); });
renderer.domElement.addEventListener('pointermove', e=>{ if(!walk.on || !walk.look || walk.look.id!==e.pointerId) return;
  walk.yaw-=(e.clientX-walk.look.x)*.0045; walk.pitch=Math.max(-1.2,Math.min(1.2,walk.pitch-(e.clientY-walk.look.y)*.0035)); walk.look.x=e.clientX; walk.look.y=e.clientY; });
['pointerup','pointercancel'].forEach(t=>renderer.domElement.addEventListener(t, e=>{ if(walk.look && walk.look.id===e.pointerId) walk.look=null; }));
// 手機搖桿
{ const joy=$('#joy'), knob=$('#joyKnob'); let jid=null;
  const setJ=e=>{ const r=joy.getBoundingClientRect(); let dx=(e.clientX-r.left-r.width/2)/(r.width/2), dy=(e.clientY-r.top-r.height/2)/(r.height/2); const l=Math.hypot(dx,dy); if(l>1){ dx/=l; dy/=l; } walk.joy={x:dx,y:dy}; knob.style.transform=`translate(${dx*34}px,${dy*34}px)`; };
  joy.addEventListener('pointerdown', e=>{ jid=e.pointerId; joy.setPointerCapture(e.pointerId); setJ(e); e.stopPropagation(); });
  joy.addEventListener('pointermove', e=>{ if(e.pointerId===jid) setJ(e); });
  ['pointerup','pointercancel'].forEach(t=>joy.addEventListener(t, e=>{ if(e.pointerId!==jid) return; jid=null; walk.joy={x:0,y:0}; knob.style.transform=''; })); }
if(matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
function updateWalk(dt){
  const k=walk.keys; let f=0, s=0;
  if(k.KeyW||k.ArrowUp) f+=1; if(k.KeyS||k.ArrowDown) f-=1; if(k.KeyD) s+=1; if(k.KeyA) s-=1;
  if(k.ArrowLeft) walk.yaw+=1.9*dt; if(k.ArrowRight) walk.yaw-=1.9*dt;
  f-=walk.joy.y; s+=walk.joy.x; const amt=Math.min(1,Math.hypot(f,s)); if(amt>0){ const l=Math.hypot(f,s); f/=l; s/=l; }
  const sp=(k.ShiftLeft||k.ShiftRight)?7:3.2, sy=Math.sin(walk.yaw), cy=Math.cos(walk.yaw);
  const mx=(-sy*f+cy*s)*sp*amt*dt, mz=(-cy*f-sy*s)*sp*amt*dt; const n=Math.max(1,Math.ceil(Math.hypot(mx,mz)/.2));

  walk.eye+=(walk.foot-walk.eye)*Math.min(1,dt*14);   // 上下台階時視線平順地跟上
  const t=performance.now()/1000; camera.position.set(walk.pos.x, walk.eye+EYE+(amt>0?Math.sin(t*(sp>4?13:9))*.035:0), walk.pos.z);
  camera.rotation.set(walk.pitch, walk.yaw, 0);
  // 靠近 360° 實景點（一樓、戶外）時提示可以進入
  let best=null, bd=4.5; Object.entries(pins).forEach(([id,p])=>{ if(p.floor!==1) return; const d=Math.hypot(p.g.position.x-walk.pos.x, p.g.position.z-walk.pos.z); if(d<bd){ bd=d; best=id; } });
  if(best!==walk.near){ walk.near=best; const b=$('#walkPrompt'); b.hidden=!best; if(best) b.textContent=`進入 360° 實景：${SC[best].name}${document.body.classList.contains('touch')?'':'（按 E）'}`; }
  drawMini();
}

/* ================== 迴圈 ================== */
const needle=document.getElementById('needle');
const clock=new THREE.Clock();
function frame(){
  const dt=clock.getDelta();
  if(walk.on){ if($('#pano-wrap').hidden) updateWalk(Math.min(dt,.1)); }
  else {
    if(fly){ fly.t=Math.min(1,fly.t+dt/fly.dur); const k=fly.t<.5?4*fly.t**3:1-(-2*fly.t+2)**3/2; camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=1) fly=null; }
    controls.update(); }
  const az=walk.on ? walk.yaw : Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
  needle.setAttribute('transform', `rotate(${(az*180/Math.PI).toFixed(1)} 20 20)`);
  const t=performance.now()/1000;
  Object.entries(pins).forEach(([id,p])=>{ if(!(selected?.type==='spot' && selected.id===id)) p.g.position.y = spotY(id)+.2+Math.sin(t*2+p.g.position.x)*.25; });
  if($('#pano-wrap').hidden){ renderer.render(scene,camera); labelRenderer.render(scene,camera); }
  requestAnimationFrame(frame);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

camera.position.set(HOME.x-40, 170, HOME.z+215); controls.target.copy(HOME);
setFloor(0); showWelcome(); frame();
</script>
